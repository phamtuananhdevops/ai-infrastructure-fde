name: Starter checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r apps/demo-api/requirements.txt httpx
      - run: python -m py_compile apps/demo-api/main.py
      - name: Test API
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'apps/demo-api')
          from fastapi.testclient import TestClient
          from main import app
          c = TestClient(app)
          assert c.get('/healthz').json() == {'status':'ok'}
          assert c.get('/api/hello').status_code == 200
          PY
